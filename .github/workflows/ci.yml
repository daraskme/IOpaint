name: CI

on:
  push:
    branches: [main, modernize-2026]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_app/package-lock.json

      - name: Install CI tooling
        run: python -m pip install --upgrade pip build pytest pytest-loguru ruff

      - name: Check generated requirements mirror
        run: python scripts/check_requirements_sync.py

      - name: Lint Python
        run: ruff check .

      - name: Install CPU PyTorch
        run: >-
          python -m pip install typing_extensions &&
          python -m pip install torch torchvision
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install IOPaint editable
        run: python -m pip install -e .

      - name: Run download-free CPU tests
        run: >-
          python -m pytest
          iopaint/tests/test_load_img.py
          iopaint/tests/test_adjust_mask.py
          iopaint/tests/test_save_quality.py
          iopaint/tests/test_save_exif.py

      - name: Smoke-test editable CLI
        run: iopaint --help

      - name: Install frontend dependencies
        working-directory: web_app
        run: npm ci

      - name: Build frontend
        working-directory: web_app
        run: npm run build

      - name: Stage embedded frontend
        run: >-
          python -c "import shutil;
          shutil.copytree('web_app/dist', 'iopaint/web_app', dirs_exist_ok=True)"

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify packaged assets
        run: python scripts/check_package_contents.py dist

      - name: Smoke-test wheel in a fresh environment (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install typing_extensions
          .wheel-venv/bin/python -m pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/iopaint --help

      - name: Smoke-test wheel in a fresh environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .wheel-venv
          & .wheel-venv\Scripts\python.exe -m pip install typing_extensions
          & .wheel-venv\Scripts\python.exe -m pip install torch torchvision `
            --index-url https://download.pytorch.org/whl/cpu
          $wheel = (Get-ChildItem -Path dist -Filter *.whl -File).FullName
          & .wheel-venv\Scripts\python.exe -m pip install $wheel
          & .wheel-venv\Scripts\iopaint.exe --help
